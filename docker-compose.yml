services:
  web:
    build: .
    container_name: employee-leave-app
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_PATH: "/data/leave_management.db"
    volumes:
      - app-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - web
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  app-data:
